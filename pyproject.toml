[project]
name = "truecost"
version = "0.1.0"
description = "Cost per task done, not per token: metering, crash-tests and a risk-budgeted governor for AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
gpu = ["nvidia-ml-py>=12"]
dev = ["pytest>=8"]
plots = ["matplotlib>=3.8"]

[project.scripts]
truecost = "truecost.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["truecost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
